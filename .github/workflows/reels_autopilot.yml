name: AI Instagram Reels Autopilot 24/7 (Cloud Scheduled)

on:
  schedule:
    # 07:00 AM & 06:00 PM Asia/Kolkata (01:30 & 12:30 UTC)
    - cron: '30 1,12 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Reel Topic (Leave blank for next fresh non-duplicate quiz)'
        required: false
        default: ''
      niche:
        description: 'Reel Niche'
        required: false
        default: 'python program quiz card reels'

jobs:
  publish_reel:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies (FFmpeg & Fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-liberation fonts-dejavu fonts-freefont-ttf

      - name: Install Python Dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Generate and Publish Fresh Quiz Reel to Instagram
        env:
          REEL_TOPIC: ${{ github.event.inputs.topic || '' }}
          REEL_NICHE: ${{ github.event.inputs.niche || 'python program quiz card reels' }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID || '17841434697950977' }}
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          META_APP_ID: ${{ secrets.META_APP_ID || '17841434697950977' }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          MONGODB_URI: ${{ secrets.MONGODB_URI || 'mongodb+srv://kbtteja456_db_user:sk8JAW7LzRixHXwR@cluster0.r3f7bqb.mongodb.net/?appName=Cluster0' }}
          MONGODB_DB_NAME: instagram_autopilot
          ZERO_COST_MODE: "true"
        run: |
          python scripts/publish_now.py
